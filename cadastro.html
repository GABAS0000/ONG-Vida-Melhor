<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">

    <title>Cadastro - ONG Vida Melhor</title>
</head>

<body>

    <main class="cadastro" id="conteudo-principal">

        <h1>Cadastro de Voluntário</h1>

        <p>
            Preencha seus dados para participar dos projetos da ONG vida melhor.
        </p>

        <form>

            <fieldset>

                <legend>Dados pessoais</legend>

                <div class="campo">

                    <label for="nome">Nome completo:</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder=""
                        required
                    >

                </div>

                <div class="campo">

                    <label for="email">Digite seu E-mail:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder=""
                        required
                    >

                </div>

                <div class="linha-campos">

                    <div class="campo">

                        <label for="data-nascimento">
                            data de nascimento:
                        </label>

                        <input
                            type="date"
                            name="data-nascimento"
                            id="data-nascimento"
                        >

                    </div>

                    <div class="campo">

                        <label for="telefone">telefone</label>

                        <input
                            type="tel"
                            name="telefone"
                            id="telefone"
                            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                            required
                        >

                    </div>

                </div>

                <div class="campo">

                    <label for="cpf">cpf</label>

                    <input
                        type="text"
                        name="cpf"
                        id="cpf"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        placeholder=""
                        required
                    >

                </div>

            </fieldset>

            <fieldset>

                <legend>Endereço</legend>

                <div class="linha-campos">

                    <div class="campo">

                        <label for="rua">rua:</label>

                        <input
                            type="text"
                            name="rua"
                            id="rua"
                        >

                    </div>

                    <div class="campo">

                        <label for="numero">numero:</label>

                        <input
                            type="number"
                            name="numero"
                            id="numero"
                        >

                    </div>

                </div>

                <div class="linha-campos">

                    <div class="campo">

                        <label for="cep">cep:</label>

                        <input
                            type="text"
                            name="cep"
                            id="cep"
                            pattern="[0-9]{5}-[0-9]{3}"
                            required
                        >

                    </div>

                    <div class="campo">

                        <label for="cidade">cidade:</label>

                        <input
                            type="text"
                            name="cidade"
                            id="cidade"
                        >

                    </div>

                    <div class="campo">

                        <label for="estado">estado:</label>

                        <input
                            type="text"
                            name="estado"
                            id="estado"
                        >

                    </div>

                </div>

            </fieldset>

            <button type="submit">
                Enviar cadastro
            </button>

        </form>

    </main>

    <footer>

        <nav>

            <h3>Navegação</h3>

            <details class="menu-mobile">

                <summary>☰</summary>

                <a href="index.html">Início</a>
                <a href="projetos.html">Projetos</a>
                <a href="cadastro.html">Cadastro</a>

            </details>

            <div class="links-navegacao">

                <p><a href="index.html">Início</a></p>
                <p><a href="projetos.html">Projetos</a></p>
                <p><a href="cadastro.html">Cadastro</a></p>

            </div>

        </nav>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./main.js"></script>

</body>
</html>
